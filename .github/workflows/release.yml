name: Release Multiplataforma Geraldo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Sincronizar Versão da Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Sincronizando versão para $TAG_VERSION..."
          python -c "
          import json, re
          p = 'src-tauri/tauri.conf.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = '$TAG_VERSION'
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2)
          cp = 'src-tauri/Cargo.toml'
          with open(cp, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"$TAG_VERSION\"', content, count=1)
          with open(cp, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Compilar Sidecar do Daemon Geraldo
        run: |
          python scripts/build_sidecar.py --target ${{ matrix.target }}

      - name: Compilar Pacotes e Instaladores (Tauri 2.0)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Geraldo Desktop v__VERSION__'
          releaseBody: 'Instaladores comerciais oficiais do Geraldo para Windows (.exe / .msi), macOS (.dmg) e Linux (.deb / .AppImage).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

