name: Release Multiplataforma Geraldo

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test:
    name: Validar Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar Dependências do Sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev portaudio19-dev pulseaudio
          pulseaudio -D --exit-idle-time=-1 || true

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar todos os testes
        run: |
          python -m pytest -v --tb=short

  release:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            target: 'aarch64-pc-windows-msvc'
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            target: 'aarch64-apple-darwin'
          - platform: 'macos-13'
            args: '--target x86_64-apple-darwin'
            target: 'x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-24.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
            target: 'aarch64-unknown-linux-gnu'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Sincronizar Versão da Tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          python -c "
          import os, json, re
          raw = os.environ.get('GITHUB_REF_NAME', '').strip()
          match = re.search(r'(\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?)', raw)
          tag_version = match.group(1) if match else re.sub(r'^[vV]\.?', '', raw)
          print(f'Sincronizando versão para {tag_version} (tag original: {raw})...')

          p = 'src-tauri/tauri.conf.json'
          with open(p, 'r', encoding='utf-8') as f:
              data = json.load(f)
          data['version'] = tag_version
          with open(p, 'w', encoding='utf-8') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
              f.write('\n')

          cp = 'src-tauri/Cargo.toml'
          with open(cp, 'r', encoding='utf-8') as f:
              content = f.read()
          content = re.sub(r'version\s*=\s*\"[^\"]+\"', f'version = \"{tag_version}\"', content, count=1)
          with open(cp, 'w', encoding='utf-8') as f:
              f.write(content)
          "

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Instalar dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Compilar Sidecar do Daemon Geraldo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEFAULT_LLM_API_KEY: ${{ secrets.DEFAULT_LLM_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python scripts/build_sidecar.py --target ${{ matrix.target }}

      - name: Compilar Pacotes e Instaladores (Tauri 2.0)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Geraldo Desktop v__VERSION__'
          releaseBody: 'Instaladores oficiais do Geraldo para Windows (x64 e ARM64), macOS (Apple Silicon e Intel) e Linux (x64 e ARM64).'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

